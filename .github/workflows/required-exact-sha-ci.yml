name: Exact source integrity inspection

on:
  pull_request:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Full repository commit SHA to inspect
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: required-exact-sha-${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  exact-sha:
    name: Inspect exact source integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Check out exact candidate SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prove exact checkout
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Reject merge, rebase, or cherry-pick residue
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .git/MERGE_HEAD
          test ! -e .git/CHERRY_PICK_HEAD
          test ! -d .git/rebase-merge
          test ! -d .git/rebase-apply
      - name: Validate repository integrity
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
              git cat-file -e "$BASE_SHA^{commit}"
              comparison_sha="$BASE_SHA"
              ;;
            workflow_dispatch)
              if git rev-parse --verify "$EXPECTED_SHA^" >/dev/null 2>&1; then
                comparison_sha="$(git rev-parse "$EXPECTED_SHA^")"
              else
                comparison_sha="$(git hash-object -t tree /dev/null)"
              fi
              ;;
            *)
              echo "Unsupported source validation event" >&2
              exit 1
              ;;
          esac
          git diff --check "$comparison_sha" "$EXPECTED_SHA" --
          git fsck --no-progress
      - name: Record exact-SHA evidence
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "evidence_type=source-integrity"
            echo "runtime_certification=false"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "sha=$(git rev-parse HEAD)"
            echo "runner=${RUNNER_NAME}"
            echo "architecture=${RUNNER_ARCH}"
            echo "os=${RUNNER_OS}"
          } | tee exact-sha-evidence.txt
      - name: Upload exact-SHA evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: exact-sha-evidence-${{ github.run_id }}
          path: exact-sha-evidence.txt
          if-no-files-found: error
          retention-days: 14
